name: Enhance dynamic motion

on:
  workflow_dispatch: {}
  push:
    paths:
      - "scripts/enhance_dynamic_motion.py"
      - "scripts/fix_stagger_selectors.py"
      - "scripts/TRIGGER_DYNAMIC"
      - ".github/workflows/enhance-dynamic.yml"

permissions:
  contents: write

jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply dynamic motion enhancements
        run: |
          set -euo pipefail
          if [ -f scripts/enhance_dynamic_motion.py ]; then
            python3 scripts/enhance_dynamic_motion.py || true
          fi
          if [ -f scripts/fix_stagger_selectors.py ]; then
            python3 scripts/fix_stagger_selectors.py
          fi
          git config user.name "Tushar Solanki"
          git config user.email "tusharsolanki9845@gmail.com"
          git add client/src/pages/Home.tsx client/src/index.css || true
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Polish dynamic motion: correct stagger selectors"
            git push origin HEAD:master
          fi
