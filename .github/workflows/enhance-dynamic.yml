name: Enhance dynamic motion

on:
  workflow_dispatch: {}
  push:
    paths:
      - "scripts/enhance_dynamic_motion.py"
      - "scripts/TRIGGER_DYNAMIC"
      - ".github/workflows/enhance-dynamic.yml"

permissions:
  contents: write

jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply dynamic motion enhancements
        run: |
          set -euo pipefail
          python3 scripts/enhance_dynamic_motion.py
          git config user.name "Tushar Solanki"
          git config user.email "tusharsolanki9845@gmail.com"
          git add client/src/pages/Home.tsx client/src/index.css
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Enhance portfolio motion: count-up stats, orbits, staggered reveals"
            git push origin HEAD:master
          fi
