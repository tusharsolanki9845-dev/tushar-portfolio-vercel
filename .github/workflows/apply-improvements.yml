name: Apply portfolio improvements
on:
  workflow_dispatch:
  push:
    paths:
      - '.restore-data/**'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble improved files from base64 parts
        run: |
          set -euo pipefail
          git config user.name "Tushar Solanki"
          git config user.email "tusharsolanki9845@gmail.com"

          if [ -d .restore-data ]; then
            cat .restore-data/home_b64_part*.txt | tr -d '\n' | base64 -d > client/src/pages/Home.tsx
            cat .restore-data/css_b64_part*.txt | tr -d '\n' | base64 -d > client/src/index.css
            rm -rf .restore-data
            # clean leftover chunks if any
            rm -rf .restore-chunks
            git add -A
            git status
            git commit -m "Implement client conversion improvements: process, FAQ, badges, outcomes, filter"
            git push origin HEAD:master
          else
            echo "No .restore-data found; nothing to apply"
          fi
