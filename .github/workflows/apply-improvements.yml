name: Apply portfolio improvements
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and commit improved files
        run: |
          set -euo pipefail
          git config user.name "Tushar Solanki"
          git config user.email "tusharsolanki9845@gmail.com"
          python3 scripts/decode_improved.py
          rm -rf .restore-data
          git add -A
          git commit -m "Next batch: pricing bands, case study, WhatsApp CTAs, fit/handoff"
          git push origin HEAD:master
