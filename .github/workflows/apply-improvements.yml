name: Apply portfolio improvements

on:
  workflow_dispatch: {}
  push:
    paths:
      - "scripts/TRIGGER_PATCH"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch pricing bands and WhatsApp CTAs
        run: |
          set -euo pipefail
          git config user.name "Tushar Solanki"
          git config user.email "tusharsolanki9845@gmail.com"
          python3 scripts/patch_pricing_whatsapp.py
          python3 scripts/patch_pricing_css.py
          git add client/src/pages/Home.tsx client/src/index.css
          git status
          git commit -m "Fix pricing bands and add WhatsApp CTAs" || echo "nothing to commit"
          git push origin HEAD:master
